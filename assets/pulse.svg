<svg viewBox="0 0 700 68" xmlns="http://www.w3.org/2000/svg" width="100%">
  <!-- Background card -->
  <rect width="700" height="68" rx="10" fill="#0d1117" stroke="#21262d" stroke-width="1"/>

  <!-- Pulsing ring 1 -->
  <circle cx="45" cy="34" r="10" fill="none" stroke="#28c840" stroke-width="1.5">
    <animate attributeName="r"       values="10;26" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0"  dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Pulsing ring 2 (offset for double-pulse effect) -->
  <circle cx="45" cy="34" r="10" fill="none" stroke="#28c840" stroke-width="1">
    <animate attributeName="r"       values="10;26" dur="2s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0"  dur="2s" begin="0.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Core dot -->
  <circle cx="45" cy="34" r="8" fill="#28c840"/>

  <!-- Status label -->
  <text x="72" y="27" fill="#8b949e"
        font-family="'Courier New', monospace" font-size="11">status: available</text>

  <!-- Main text -->
  <text x="72" y="50" fill="#e6edf3"
        font-family="'Courier New', monospace" font-size="14" font-weight="bold">Security × Product · Open to conversations</text>
</svg>
