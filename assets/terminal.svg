<svg viewBox="0 0 800 222" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <filter id="glow-red">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-yellow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-green">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .t  { font-family: 'Courier New', Courier, monospace; font-size: 14px; }
      .sm { font-family: 'Courier New', Courier, monospace; font-size: 11px; }
      .line { opacity: 0; }
      .l1  { animation: show 0.4s ease  0.5s forwards; }
      .l2  { animation: show 0.4s ease  1.2s forwards; }
      .l3  { animation: show 0.4s ease  2.1s forwards; }
      .l4  { animation: show 0.4s ease  2.8s forwards; }
      .l5  { animation: show 0.4s ease  3.7s forwards; }
      .l6  { animation: show 0.4s ease  4.4s forwards; }
      .l7  { animation: show 0.4s ease  4.4s forwards; }
      .cur { animation: blink 1s step-end 4.8s infinite; }
      @keyframes show  { to { opacity: 1; } }
      @keyframes blink { 50% { opacity: 0; } }
      .p  { fill: #7c6af7; }
      .hp { fill: #c084fc; }
      .o  { fill: #cdd9e5; }
      .d  { fill: #8b949e; }
    </style>
  </defs>

  <!-- Terminal window background -->
  <rect width="800" height="222" rx="12" ry="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Title bar background -->
  <rect width="800" height="38" rx="12" ry="12" fill="#161b22"/>
  <rect x="0" y="28" width="800" height="10" fill="#161b22"/>

  <!-- Title bar bottom border -->
  <line x1="0" y1="38" x2="800" y2="38" stroke="#21262d" stroke-width="1"/>

  <!-- Traffic lights with glow -->
  <circle cx="20"  cy="19" r="6" fill="#ff5f57" filter="url(#glow-red)"/>
  <circle cx="40"  cy="19" r="6" fill="#febc2e" filter="url(#glow-yellow)"/>
  <circle cx="60"  cy="19" r="6" fill="#28c840" filter="url(#glow-green)"/>

  <!-- Tab label -->
  <text class="sm" x="400" y="24" text-anchor="middle" fill="#8b949e">bash — kishor@K871git: ~</text>

  <!-- ── Line 1: $ whoami ── -->
  <text class="t line l1" y="67">
    <tspan x="20" class="p">kishor</tspan><tspan class="d">@K871git</tspan><tspan class="d">:</tspan><tspan class="hp">~</tspan><tspan class="d">$ </tspan><tspan class="o">whoami</tspan>
  </text>

  <!-- ── Line 2: output ── -->
  <text class="t line l2 o" x="20" y="89">Security Engineer · Biz Secure Labs · Pune, IN</text>

  <!-- ── Line 3: $ ls ./shipped/ ── -->
  <text class="t line l3" y="117">
    <tspan x="20" class="p">kishor</tspan><tspan class="d">@K871git</tspan><tspan class="d">:</tspan><tspan class="hp">~</tspan><tspan class="d">$ </tspan><tspan class="o">ls ./shipped/</tspan>
  </text>

  <!-- ── Line 4: output ── -->
  <text class="t line l4" y="139">
    <tspan x="20" class="hp">KareerOS/</tspan><tspan class="d">   </tspan><tspan class="hp">Clinora/</tspan><tspan class="d">   </tspan><tspan class="hp">Thaelon/</tspan><tspan class="d">          # 3 products · 421+ commits</tspan>
  </text>

  <!-- ── Line 5: $ cat stack.conf ── -->
  <text class="t line l5" y="167">
    <tspan x="20" class="p">kishor</tspan><tspan class="d">@K871git</tspan><tspan class="d">:</tspan><tspan class="hp">~</tspan><tspan class="d">$ </tspan><tspan class="o">cat stack.conf</tspan>
  </text>

  <!-- ── Line 6: output ── -->
  <text class="t line l6 o" x="20" y="189">Laravel · React · Rust · Tauri · YARA · ClickHouse · Ollama AI</text>

  <!-- ── Line 7: next prompt + blinking cursor ── -->
  <text class="t line l7" y="211">
    <tspan x="20" class="p">kishor</tspan><tspan class="d">@K871git</tspan><tspan class="d">:</tspan><tspan class="hp">~</tspan><tspan class="d">$ </tspan><tspan class="cur p">▋</tspan>
  </text>

</svg>
