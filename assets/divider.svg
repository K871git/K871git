<svg viewBox="0 0 800 18" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="sg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#4a1eff" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#7c6af7" stop-opacity="1"/>
      <stop offset="50%"  stop-color="#c084fc" stop-opacity="1"/>
      <stop offset="70%"  stop-color="#7c6af7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#4a1eff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Static base line -->
  <line x1="0" y1="9" x2="800" y2="9" stroke="#21262d" stroke-width="1"/>
  <!-- Sweeping glow — pure SMIL, no CSS transforms -->
  <rect y="7" width="160" height="4" rx="2" fill="url(#sg)">
    <animate attributeName="x" from="-160" to="800" dur="2.5s" repeatCount="indefinite"/>
  </rect>
</svg>
