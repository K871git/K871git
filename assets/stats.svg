<svg viewBox="0 0 800 100" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <style>
      .card { opacity: 0; }
      .c1 { animation: show 0.5s ease 0.2s forwards; }
      .c2 { animation: show 0.5s ease 0.5s forwards; }
      .c3 { animation: show 0.5s ease 0.8s forwards; }
      .c4 { animation: show 0.5s ease 1.1s forwards; }
      @keyframes show { to { opacity: 1; } }
    </style>
  </defs>

  <!-- Card 1: Products Shipped -->
  <g class="card c1">
    <rect x="10" y="8" width="180" height="84" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="100" y="57" text-anchor="middle" fill="#7c6af7"
          font-family="'Courier New', monospace" font-size="32" font-weight="bold">3</text>
    <text x="100" y="78" text-anchor="middle" fill="#8b949e"
          font-family="'Courier New', monospace" font-size="11">Products Shipped</text>
  </g>

  <!-- Card 2: Commits -->
  <g class="card c2">
    <rect x="210" y="8" width="180" height="84" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="300" y="57" text-anchor="middle" fill="#4a1eff"
          font-family="'Courier New', monospace" font-size="28" font-weight="bold">421+</text>
    <text x="300" y="78" text-anchor="middle" fill="#8b949e"
          font-family="'Courier New', monospace" font-size="11">Commits</text>
  </g>

  <!-- Card 3: Years -->
  <g class="card c3">
    <rect x="410" y="8" width="180" height="84" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="500" y="57" text-anchor="middle" fill="#c084fc"
          font-family="'Courier New', monospace" font-size="32" font-weight="bold">2+</text>
    <text x="500" y="78" text-anchor="middle" fill="#8b949e"
          font-family="'Courier New', monospace" font-size="11">Years Experience</text>
  </g>

  <!-- Card 4: Domains -->
  <g class="card c4">
    <rect x="610" y="8" width="180" height="84" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="700" y="57" text-anchor="middle" fill="#7c6af7"
          font-family="'Courier New', monospace" font-size="32" font-weight="bold">4</text>
    <text x="700" y="78" text-anchor="middle" fill="#8b949e"
          font-family="'Courier New', monospace" font-size="11">Domains</text>
  </g>
</svg>
